# Default rules plus three they miss. Allowlist false positives narrowly, never by
# turning a rule off.
[extend]
useDefault = true

# Skips test passwords (fpl, pw, <password>), [YOUR-PASSWORD], and weak ones like
# password1 or postgres.
[[rules]]
id = "postgres-url-password"
description = "Password in a Postgres connection URL"
regex = '''postgres(?:ql)?(?:\+[a-z0-9]+)?://[^:/\s@]+:([^@/\s<>{}\[\]]{8,})@'''
secretGroup = 1
entropy = 3.0
keywords = ["postgres"]

# re_, 8 letters and digits, _, then 24, checked against a real key in November
# 2026. Skips the docs' re_123456789.
[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''\b(re_(?:[A-Za-z0-9]{8,}_)?[A-Za-z0-9]{20,})\b'''
secretGroup = 1
entropy = 3.0
keywords = ["re_"]

# Caught wherever it is, not only next to a word like "key". Skips the docs'
# sb_secret_... placeholder. Same rule as fpl-social's.
[[rules]]
id = "supabase-secret-key"
description = "Supabase secret key"
regex = '''\b(sb_secret_[A-Za-z0-9_-]{20,})\b'''
secretGroup = 1
keywords = ["sb_secret_"]
