# Gitleaks' default rules, plus DATABASE_URL's password and Resend's keys, which
# they miss. Allowlist a false positive here as narrowly as possible (see
# CLAUDE.md), never by turning a rule off.
[extend]
useDefault = true

# Test URLs' passwords (fpl, test, pw, <password>) and Supabase's [YOUR-PASSWORD]
# placeholder don't match. Neither does a weak hand-set password (password1,
# postgres): below the entropy limit, which stays so local defaults pass.
[[rules]]
id = "postgres-url-password"
description = "Password in a Postgres connection URL"
regex = '''postgres(?:ql)?(?:\+[a-z0-9]+)?://[^:/\s@]+:([^@/\s<>{}\[\]]{8,})@'''
secretGroup = 1
entropy = 3.0
keywords = ["postgres"]

# Resend's keys are re_, 8 letters and digits, _, then 24 (checked against a real
# key in November 2026). Its docs' placeholder (re_123456789) is too short to
# match.
[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''\b(re_(?:[A-Za-z0-9]{8,}_)?[A-Za-z0-9]{20,})\b'''
secretGroup = 1
entropy = 3.0
keywords = ["re_"]
