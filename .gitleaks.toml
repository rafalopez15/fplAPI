# Gitleaks' default rules, plus DATABASE_URL's password, which they miss. Allowlist
# a false positive here as narrowly as possible (see CLAUDE.md), never by turning
# a rule off.
[extend]
useDefault = true

# Test URLs' passwords (fpl, test, pw, <password>) are too short or too plain to
# match.
[[rules]]
id = "postgres-url-password"
description = "Password in a Postgres connection URL"
regex = '''postgres(?:ql)?(?:\+[a-z0-9]+)?://[^:/\s@]+:([^@/\s<>{}]{8,})@'''
secretGroup = 1
entropy = 3.0
keywords = ["postgres"]
