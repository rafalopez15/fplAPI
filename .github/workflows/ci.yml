name: CI

# PRs run lint, formatting and tests, then post one comment with the summaries.
# Pushes to main run them again on the merged code. Other branch pushes don't run CI
# until a PR is opened, so PR branches don't run everything twice.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Analysing the code with pylint
      # Readable output in the log, plus a JSON report for the summary step.
      run: |
        pylint --output-format=colorized,json2:pylint-report.json $(git ls-files '*.py')
    - name: Summarize pylint results
      if: always()
      run: |
        python .github/scripts/summarize_pylint.py pylint-report.json pylint-summary.md
    - name: Upload the summary for the PR comment
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-summary-pylint
        path: pylint-summary.md
        if-no-files-found: ignore
        retention-days: 7

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Install Black
      # Only the version pinned in requirements-dev.txt; the app isn't needed.
      run: |
        python -m pip install --upgrade pip
        pip install "$(grep '^black==' requirements-dev.txt)"
    - name: Check formatting with Black
      # Fails if any file would change. The diff and the file list are saved for
      # the summary, then shown in the log.
      run: |
        status=0
        black --check --diff . > black.diff 2> black.log || status=$?
        cat black.log black.diff
        exit $status
    - name: Summarize formatting
      if: always()
      run: |
        python .github/scripts/summarize_black.py black.log black.diff formatting-summary.md
    - name: Upload the summary for the PR comment
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-summary-formatting
        path: formatting-summary.md
        if-no-files-found: ignore
        retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # to download main's coverage report
      pull-requests: read  # to list the PR's changed files
    services:
      # A throwaway database for the tests. Never point tests at Supabase.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fpl
          POSTGRES_PASSWORD: fpl
          POSTGRES_DB: fpl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fpl -d fpl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fpl:fpl@localhost:5432/fpl_test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Run tests with coverage
      # -v lists every test, -ra adds a summary of anything that didn't pass.
      # coverage.xml is for the coverage summary; local runs don't write it.
      run: |
        python -m pytest -v -ra --junitxml=test-results.xml --cov-report=xml:coverage.xml
    - name: Summarize test results
      if: always()
      run: |
        python .github/scripts/summarize_tests.py test-results.xml tests-summary.md
    - name: Get main's coverage and the PR's changed files
      if: always() && github.event_name == 'pull_request'
      # Main's report is from its latest successful CI run. Without one, the summary
      # says there's nothing to compare against. The changed files come from GitHub's
      # API, not git, so they don't depend on how much history the checkout fetched.
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
          --branch main --event push --status success --limit 1 \
          --json databaseId --jq '.[0].databaseId')
        if [ -n "$run_id" ]; then
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n coverage-main \
            -D baseline || echo "No coverage report on main's run $run_id"
        fi
        # If GitHub can't list them, the summary leaves the table out rather than
        # saying nothing changed.
        if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only > changed-files.txt; then
          echo "Changed files:"
          cat changed-files.txt
        else
          echo "Couldn't list the PR's changed files"
          rm -f changed-files.txt
        fi
    - name: Summarize coverage
      if: always()
      run: |
        python .github/scripts/summarize_coverage.py coverage.xml \
          baseline/coverage.xml changed-files.txt coverage-summary.md
    - name: Upload the summaries for the PR comment
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-summary-tests
        path: |
          tests-summary.md
          coverage-summary.md
        if-no-files-found: ignore
        retention-days: 7
    - name: Save main's coverage for PRs to compare against
      if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-main
        path: coverage.xml
        if-no-files-found: ignore
        retention-days: 90

  report:
    name: PR comment
    # Runs after the other jobs even when they fail, so failures get reported.
    # Dependabot's runs get a read-only token, so they can't comment.
    if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: [lint, format, test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Download the summaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ci-summary-*
        merge-multiple: true
        path: summaries
    - name: Post or update the CI comment
      # One comment per PR, found by its hidden marker and edited in place on
      # later pushes, so the PR doesn't collect a comment per push.
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.pull_request.head.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        marker='<!-- ci-report -->'
        {
          echo "$marker"
          echo "**CI for \`${SHA:0:7}\`** · [workflow run]($RUN_URL)"
          echo
          cat summaries/tests-summary.md 2>/dev/null || echo "## ⚠️ Tests didn't report results"
          echo
          cat summaries/coverage-summary.md 2>/dev/null || echo "## ⚠️ Coverage wasn't reported"
          echo
          cat summaries/pylint-summary.md 2>/dev/null || echo "## ⚠️ Pylint didn't report results"
          echo
          cat summaries/formatting-summary.md 2>/dev/null || echo "## ⚠️ Black didn't report results"
        } > comment.md

        comment_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
          | head -n 1)
        if [ -n "$comment_id" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@comment.md > /dev/null
          echo "Updated comment $comment_id"
        else
          gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          echo "Created a comment"
        fi
