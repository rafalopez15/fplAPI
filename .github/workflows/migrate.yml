name: Migrate database

# Production migrates only from main. Staging, the database Vercel previews use,
# also migrates on pull requests, so a PR's schema change is live on its preview.
# The hourly sync calls it first, in case a push run was lost.
on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "src/db/**"
      - "alembic.ini"
  pull_request:
    paths:
      - "migrations/**"
      - "src/db/**"
      - "alembic.ini"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      # A called run sees the caller's github.event_name.
      from_sync:
        description: Called by the hourly sync
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  production:
    # A run started by hand from another branch only touches staging.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with the production sync, so a sync never runs mid-migration.
    concurrency:
      group: database
      cancel-in-progress: false
    # Only main can read this environment's secrets.
    environment:
      name: production
      deployment: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Apply migrations
      # Secret on this step only, not pip install. Warns if the sync had to migrate.
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        FROM_SYNC: ${{ inputs.from_sync }}
      run: |
        before=$(alembic current)
        alembic upgrade head
        after=$(alembic current)
        echo "$after"
        if [ "$FROM_SYNC" = "true" ] && [ "$before" != "$after" ]; then
          echo "::warning title=Migration applied by the sync::Production went from '${before:-no revision}' to '$after'. The push run for this migration didn't apply it."
        fi

  staging:
    # Dependabot's runs can't read repository secrets. Not from the sync: staging
    # may be at a PR's revision.
    if: github.actor != 'dependabot[bot]' && !inputs.from_sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: staging-database
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Apply migrations
      # Secret on this step only, not pip install.
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      run: |
        alembic upgrade head
        alembic current
    # With this branch's code, so a new table it adds has data on the preview.
    - name: Sync
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      run: python -m src.jobs.sync_bootstrap
