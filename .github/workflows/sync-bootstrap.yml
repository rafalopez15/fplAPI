name: Sync bootstrap-static

on:
  schedule:
    # Backup only: GitHub skips most scheduled runs. Off the top of the hour,
    # when GitHub's scheduler is busiest.
    - cron: "17 * * * *"
  # Started every hour by a pg_cron job in Supabase (README: "Hourly trigger"),
  # and by hand from the Actions tab.
  workflow_dispatch:

# Shared with the migration workflow, so a sync never runs mid-migration.
concurrency:
  group: database
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Sync
      run: python -m src.jobs.sync_bootstrap
