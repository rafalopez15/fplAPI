name: Sync bootstrap-static

on:
  schedule:
    # Hourly. Off the top of the hour, when GitHub's scheduler is busiest.
    - cron: "17 * * * *"
  workflow_dispatch:

# Shared with the migration workflow, so a sync never runs mid-migration.
concurrency:
  group: database
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Configure
      # The FPL URLs come from .env.example. DATABASE_URL is already set from the
      # secret, and python-dotenv doesn't override variables that are set.
      run: cp .env.example .env
    - name: Sync
      run: python -m src.jobs.sync_bootstrap
