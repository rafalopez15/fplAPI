name: Sync bootstrap-static

on:
  schedule:
    # Backup only: GitHub skips most scheduled runs. Off the top of the hour,
    # when GitHub's scheduler is busiest.
    - cron: "17 * * * *"
  # Started every hour by a pg_cron job in Supabase (README: "Hourly trigger"),
  # and by hand from the Actions tab.
  workflow_dispatch:

jobs:
  production:
    # A run started by hand from another branch only touches staging.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with the production migration, so a sync never runs mid-migration.
    concurrency:
      group: database
      cancel-in-progress: false
    # Only main can read this environment's secrets.
    environment:
      name: production
      deployment: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.13
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Sync
      # Secret on this step only, not pip install.
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python -m src.jobs.sync_bootstrap

  # Hourly too: it keeps the previews' data current and stops the free staging
  # project pausing after a week without activity.
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: staging-database
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.13
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Sync
      # Secret on this step only, not pip install.
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      run: python -m src.jobs.sync_bootstrap
